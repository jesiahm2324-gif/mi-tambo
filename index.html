<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Tambo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f4d3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" id="ati" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Mi Tambo</title>
<style>
:root{--bg:#eceee9;--card:#fff;--tx:#14231b;--mu:#5d6c63;--pr:#1f4d3a;--pt:#fff;--bd:#d8ddd5;--ac:#a8832f;--wa:#b3382c;--wb:#fbeceb;--sh:0 1px 2px #14231b0d,0 6px 18px -8px #14231b26;--sf:ui-serif,"New York",Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1511;--card:#15201a;--tx:#e8efe9;--mu:#91a196;--pr:#62b588;--pt:#07120c;--bd:#24322a;--ac:#d0a94f;--wa:#ff8f80;--wb:#33201d;--sh:0 1px 2px #0006,0 8px 20px -10px #000a}}
:root[data-theme="dark"]{--bg:#0d1511;--card:#15201a;--tx:#e8efe9;--mu:#91a196;--pr:#62b588;--pt:#07120c;--bd:#24322a;--ac:#d0a94f;--wa:#ff8f80;--wb:#33201d;--sh:0 1px 2px #0006,0 8px 20px -10px #000a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{padding:18px 16px 118px;max-width:640px;margin:auto}
h1{font:600 30px/1.1 var(--sf);letter-spacing:-.01em;margin:6px 0 14px}
h2{font:600 17px/1.2 var(--sf);color:var(--tx);margin:24px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:13px 15px;margin-bottom:9px;box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .row>span:last-child{white-space:nowrap}
.card .row>*:first-child{min-width:0}.card .row .b{overflow-wrap:anywhere}
.mu{color:var(--mu);font-size:14px}.b{font-weight:600}
.warn{background:var(--wb);color:var(--wa);border-color:var(--wa);box-shadow:none}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:11px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:4px}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;background:var(--pr);color:var(--pt);font-weight:600;letter-spacing:.01em;width:100%}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--wb);color:var(--wa)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:4}
nav a{flex:1;text-align:center;padding:7px 0 6px;font-size:11px;color:var(--mu);text-decoration:none;position:relative}
nav a b{display:block;font-size:20px;filter:grayscale(1);opacity:.65}
nav a.on{color:var(--pr);font-weight:700}nav a.on b{filter:none;opacity:1}
nav a.on::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:2px;border-radius:2px;background:var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:auto;border-radius:30px;padding:14px 22px;background:var(--ac);color:#1a1405;box-shadow:0 8px 20px -6px #0006;z-index:4}
#sh{position:fixed;inset:0;background:#0a120d99;display:none;align-items:flex-end;z-index:9}
#sh>div{background:var(--bg);width:100%;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){#sh>div{animation:none}}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:12px;margin-left:6px;color:var(--mu)}
.rt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.rt td{padding:7px 0;border-bottom:1px solid var(--bd)}.rt td:last-child{text-align:right;font-weight:600}
.ph{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--bd);flex:none}
.ph.lg{width:58px;height:58px;border-radius:50%;object-position:50% 35%}
.ph0{display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--bg);filter:grayscale(1);opacity:.6}
.ac{display:flex;gap:12px;align-items:center;padding:9px 12px;margin-bottom:7px}.am{flex:1;min-width:0}
.an{font:600 17px/1.15 var(--sf)}.ar{font-size:14px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}.ae{font-size:13px;color:var(--pr)}.sm{font-size:12.5px;margin-top:4px}
[data-prof] .ph{box-shadow:0 0 0 2px var(--ac);border:0}
.gear{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:14px;width:auto;padding:7px 11px;border-radius:20px;background:var(--card);color:var(--tx);border:1px solid var(--bd);z-index:5;font-size:17px;box-shadow:var(--sh)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:9px}.g .card{margin:0}.g .b{font-family:var(--sf)}
.big{font:600 34px/1 var(--sf);color:var(--pr)}
</style>
</head>
<body>
<main id="app"></main>
<button class="gear" id="gear">⚙️</button><datalist id="tags"></datalist><datalist id="pots"></datalist>
<button class="fab" id="fab">+ Nuevo</button>
<nav id="nav"></nav>
<div id="sh"><div id="shc"></div></div>
<script>
const CATS=["Vaca en ordeñe","Vaca seca","Vaquillona","Ternera","Ternero","Toro"];
const SAN=["Vacunación","Tratamiento","Mastitis","Desparasitación","Control veterinario"];
const MOV=["Nacimiento","Compra","Venta","Muerte"];
let S={animals:[],events:[],moves:[]},tab="rebano",q="";
const norm=()=>{S.animals=S.animals||[];S.events=S.events||[];S.moves=S.moves||[];S.repro=S.repro||[];S.fin=S.fin||[];S.meta=S.meta||{};S.tools=S.tools||[];S.milk=S.milk||[];S.potlog=S.potlog||[]};
const IDB=()=>new Promise((res,rej)=>{const r=indexedDB.open("mitambo",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=async()=>{const d=await IDB();return new Promise((res,rej)=>{const q=d.transaction("kv").objectStore("kv").get("S");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const idbSet=async v=>{const d=await IDB();return new Promise((res,rej)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,"S");t.oncomplete=res;t.onerror=()=>rej(t.error)})};
norm();
let svT=0;const save=()=>{const v=JSON.stringify(S);clearTimeout(svT);svT=setTimeout(()=>idbSet(v).catch(()=>{try{localStorage.setItem("tambo",v)}catch(e){alert("No se pudo guardar. Revisá el espacio del teléfono y hacé un respaldo.")}}),150)};
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?d.split("-").reverse().join("/"):"";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const owners=()=>[...new Set(S.animals.map(a=>a.owner).filter(Boolean))].sort();
const act=()=>S.animals.filter(a=>a.status!=="baja");
const byId=id=>id==="ALL"?{ALL:1}:S.animals.find(a=>a.id===id);
const nm=a=>a&&a.ALL?"Todo el rebaño":a?("#"+esc(a.tag)+(a.name?" "+esc(a.name):"")):"(eliminado)";
function until(e){if(!e.days)return null;const d=new Date(e.date+"T00:00");d.setDate(d.getDate()+ +e.days);return d.toISOString().slice(0,10)}
const opts=(a,sel)=>a.map(x=>`<option ${x===sel?"selected":""}>${x}</option>`).join("");

function alerts(){
  const t=today(),L=[];
  fem().forEach(a=>{const s=rs(a.id);if(s.st==="preñada"&&s.due){const r=dd(s.due,t);if(r<=AD())L.push({k:"parto",r,i:"🐄",t:"Parto: "+raw(a),d:s.due,aid:a.id})}else if((s.st==="parida"||s.st==="vacía")&&s.lp){const dp=dd(t,s.lp),lim=+cfg().vac||90;if(dp>=lim)L.push({k:"vacia",r:lim-dp,i:"⚠️",t:"Vacía: "+raw(a),d:s.lp,aid:a.id,m:dp+" d desde el parto sin preñez"})}});
  S.events.forEach(e=>{if(!e.next)return;const pr=(e.product||"").toLowerCase();
    if(S.events.some(x=>x!==e&&x.aid===e.aid&&x.type===e.type&&(x.product||"").toLowerCase()===pr&&x.date>e.date))return;
    const r=dd(e.next,t);if(r<=AD())L.push({k:"vac",r,i:"💉",t:e.type+(e.product?" · "+e.product:"")+": "+raw(byId(e.aid)),d:e.next,aid:e.aid})});
  return L.sort((a,b)=>a.r-b.r)}
function alHtml(L,nohead){
  if(!L.length)return "";
  const w=r=>r<0?"vencida hace "+(-r)+" d":r===0?"¡hoy!":"en "+r+" d";
  return (nohead?"":`<h2>🔔 Alertas (${L.length})</h2>`)+L.map(x=>`<div class="card ${x.r<=7?"warn":""}" ${x.aid&&x.aid!=="ALL"?`data-a="${x.aid}"`:""}><div class="row"><span class="b">${x.i} ${esc(x.t)}</span><span>${x.m||w(x.r)}</span></div><div class="mu">${x.k==="vacia"?"Último parto: ":""}${fmt(x.d)}</div></div>`).join("")}
function setIcon(){const l=$("ati"),lg=(S.meta.prof||{}).logo||"icon-180.png";if(l&&l.getAttribute("href")!==lg)l.setAttribute("href",lg)}
function render(){
  setIcon();$("gear").style.display=tab==="rebano"?"":"none";$("tags").innerHTML=S.animals.map(a=>`<option value="${esc(a.tag)}">${esc(a.name)}</option>`).join("");$("pots").innerHTML=potreros().map(p=>`<option value="${esc(p)}">`).join("");
  const NA=alerts().length;
  const tabs=[["rebano","🐄","Rebaño"],["animales","🏷️","Animales"],["sanidad","💉","Sanidad"],["repro","🤰","Preñez"],["caja","💰","Caja"]];
  $("nav").innerHTML=tabs.map(t=>`<a href="#" data-t="${t[0]}" class="${tab===t[0]?"on":""}"><b>${t[1]}</b>${t[2]}${t[0]==="rebano"&&NA?` <span style="background:var(--wa);color:var(--pt);border-radius:9px;padding:0 6px;font-size:11px">${NA}</span>`:""}</a>`).join("");
  $("fab").textContent=tab==="rebano"?"+ Movimiento":tab==="animales"?"+ Animal":tab==="sanidad"?"+ Sanidad":tab==="repro"?"+ Evento":"+ Ingreso/Gasto";
  $("app").innerHTML=tab==="rebano"?vRebano():tab==="animales"?vAnimales():tab==="sanidad"?vSanidad():tab==="repro"?vRepro():vCaja();
}
function vRebano(){
  const A=act(),c={};A.forEach(a=>c[a.cat]=(c[a.cat]||0)+1);
  const m=[...S.moves].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);
  const AL=alerts();
  const lb=S.meta.lastBackup,old=!lb||dd(today(),lb)>30;
  return `${hdr()}<div class="card ${old?"warn":""}" data-rep><div class="row"><span class="b">📊 Reportes y respaldo</span><span>›</span></div><div class="mu">${lb?"Último respaldo: "+fmt(lb):"Todavía no hiciste un respaldo"}</div></div><div class="card" data-milk><div class="row"><span class="b">🥛 Producción de leche</span><span>hoy ${S.milk.filter(m=>m.date===today()).reduce((x,m)=>x+m.l,0)} L ›</span></div></div><div class="card" data-tools><div class="row"><span class="b">🛠️ Herramientas de la finca</span><span>${S.tools.length} ›</span></div></div>${alHtml(AL)}<div class="card"><div class="mu">Total de animales</div><div class="big">${A.length}</div></div>
  <div class="g">${CATS.map(k=>`<div class="card"><div class="mu">${k}</div><div class="b" style="font-size:22px">${c[k]||0}</div></div>`).join("")}</div>
  <h2>Inventario del mes</h2><div class="card"><table class="rt">${invRows("mes").map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table></div>
  <h2>Últimos movimientos</h2>${m.map(x=>`<div class="card"><div class="row"><span class="b">${x.type}</span><span class="mu">${fmt(x.date)}</span></div><div class="mu">#${esc(x.tag)}${x.note?" · "+esc(x.note):""}</div></div>`).join("")||'<p class="mu">Sin movimientos todavía.</p>'}`;
}
function vAnimales(){
  const l=act().filter(a=>(a.tag+" "+a.name+" "+a.cat+" "+(a.owner||"")).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.tag.localeCompare(b.tag,"es",{numeric:true}));
  return `<h1>Animales</h1><button class="s" data-pl>📄 Listado en PDF</button><br><br><input id="q" placeholder="Buscar caravana, nombre o categoría" value="${esc(q)}">
  ${l.map(a=>`<div class="card ac" data-a="${a.id}">${a.photo?`<img class="ph lg" src="${a.photo}">`:'<div class="ph lg ph0">🐄</div>'}<div class="am"><div class="row"><span class="b an">${esc(a.name)||"Sin nombre"}${rs(a.id).st==="preñada"?" 🤰":""}</span><span class="tag">${a.cat}</span></div><div class="ar">Arete ${esc(a.tag)}</div><div class="ae">${a.born?edad(a.born):"Sin fecha de nacimiento"}</div></div></div>`).join("")||'<p class="mu">No hay animales cargados.</p>'}`;
}
function vSanidad(){
  const t=today(),r=S.events.filter(e=>until(e)&&until(e)>=t);
  const l=[...S.events].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);
  const VA=alerts().filter(x=>x.k==="vac");
  return `<h1>Sanidad</h1>${VA.length?`<h2>Próximas aplicaciones (30 días)</h2>${alHtml(VA,1)}`:""}
  ${r.length?`<h2>En período de retiro</h2>${r.map(e=>`<div class="card warn"><div class="b">${nm(byId(e.aid))}</div><div>${e.type}${e.product?" · "+esc(e.product):""}</div><div>No enviar leche/carne hasta el ${fmt(until(e))}</div></div>`).join("")}`:""}
  <h2>Historial</h2>${l.map(e=>`<div class="card" data-e="${e.id}"><div class="row"><span class="b">${nm(byId(e.aid))}</span><span class="mu">${fmt(e.date)}</span></div><div>${e.type}${e.product?" · "+esc(e.product):""}</div>${e.note?`<div class="mu">${esc(e.note)}</div>`:""}</div>`).join("")||'<p class="mu">Sin registros sanitarios.</p>'}`;
}
const GEST=283,FEM=["Vaca en ordeñe","Vaca seca","Vaquillona"];
const fem=()=>act().filter(a=>FEM.includes(a.cat));
const ymd=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
const addD=(d,n)=>{const x=new Date(d+"T00:00");x.setDate(x.getDate()+n);return ymd(x)};
const addM=(d,n)=>{const x=new Date(d+"T00:00"),k=x.getDate();x.setMonth(x.getMonth()+n);if(x.getDate()!==k)x.setDate(0);return ymd(x)};
const dd=(a,b)=>Math.round((new Date(a+"T00:00")-new Date(b+"T00:00"))/864e5);
function rs(aid){let s={st:"sin datos"};
  S.repro.filter(r=>r.aid===aid).sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
    if(r.type==="Servicio")s={st:"servida",svc:r.date,lp:s.lp,bull:r.bull};
    else if(r.type==="Diagnóstico")s=r.result==="Preñada"?{...s,st:"preñada",due:r.due||(s.svc?addM(s.svc,9):null)}:{st:"vacía",lp:s.lp};
    else if(r.type==="Parto")s={st:"parida",lp:r.date};
    else if(r.type==="Aborto")s={st:"vacía",lp:s.lp}});
  return s}
function vRepro(){
  const t=today(),F=fem().map(a=>({a,s:rs(a.id)})),n=k=>F.filter(x=>x.s.st===k).length;
  const pr=F.filter(x=>x.s.st==="preñada"&&x.s.due).sort((x,y)=>x.s.due.localeCompare(y.s.due));
  const dg=F.filter(x=>x.s.st==="servida"&&dd(t,x.s.svc)>=30);
  const sec=pr.filter(x=>x.a.cat==="Vaca en ordeñe"&&dd(x.s.due,t)<=60);
  const l=[...S.repro].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25);
  const c=(x,m,w)=>`<div class="card ${w?"warn":""}" data-a="${x.a.id}"><div class="row"><span class="b">${nm(x.a)}</span><span>${m}</span></div></div>`;
  return `<h1>Preñez y partos</h1><div class="g">
  <div class="card"><div class="mu">Preñadas</div><div class="big">${n("preñada")}</div></div>
  <div class="card"><div class="mu">Servidas (sin diagnóstico)</div><div class="big">${n("servida")}</div></div>
  <div class="card"><div class="mu">Vacías</div><div class="big">${n("vacía")}</div></div>
  <div class="card"><div class="mu">Paridas</div><div class="big">${n("parida")}</div></div></div>
  ${dg.length?`<h2>Para diagnosticar</h2>${dg.map(x=>c(x,"servida hace "+dd(t,x.s.svc)+" d",1)).join("")}`:""}
  ${sec.length?`<h2>Para secar (≤60 días al parto)</h2>${sec.map(x=>c(x,"parto "+fmt(x.s.due),1)).join("")}`:""}
  <h2>Próximos partos</h2>${pr.map(x=>{const r=dd(x.s.due,t);return c(x,r<=0?"¡Parto esperado!":fmt(x.s.due)+" · en "+r+" d",r<=15)}).join("")||'<p class="mu">Sin vacas preñadas con fecha.</p>'}
  ${F.filter(x=>x.s.st==="preñada"&&!x.s.due).map(x=>c(x,"sin fecha · tocá para cargarla",1)).join("")}
  <h2>Últimos eventos</h2>${l.map(e=>`<div class="card" data-r="${e.id}"><div class="row"><span class="b">${nm(byId(e.aid))}</span><span class="mu">${fmt(e.date)}</span></div><div>${e.type}${e.result?" · "+e.result:""}</div><div class="mu">${esc(e.detail)}${e.note?" · "+esc(e.note):""}</div>${e.due?`<div class="b" style="color:var(--pr)">Parto probable: ${fmt(e.due)}</div>`:""}</div>`).join("")||'<p class="mu">Sin eventos reproductivos.</p>'}`;
}
function fRepro(){
  const F=fem();if(!F.length)return alert("Primero cargá una vaca o vaquillona");
  const X={Servicio:`<label>Tipo</label><select id="x1">${opts(["Inseminación","Monta natural"])}</select><label>Toro / pajuela</label><input id="x2">`,
  "Diagnóstico":`<label>Resultado</label><select id="x1">${opts(["Preñada","Vacía"])}</select><label>Método</label><select id="x2">${opts(["Tacto","Ecografía"])}</select><label>Fecha en que se preñó (servicio o monta). Si ya registraste el servicio, se toma de ahí.</label><input type="date" id="x3">`,
  Parto:`<label>Cría</label><select id="x1">${opts(["Hembra","Macho","Mortinato"])}</select><label>Caravana de la cría</label><input id="x2"><label>Tipo de parto</label><select id="x3">${opts(["Normal","Asistido","Difícil"])}</select>`,Aborto:""};
  sheet(`<h1>Evento reproductivo</h1>
  <label>Vaca</label><select id="f_a">${F.map(a=>`<option value="${a.id}">#${esc(a.tag)} ${esc(a.name)}</option>`).join("")}</select>
  <label>Evento</label><select id="f_t">${opts(Object.keys(X))}</select>
  <label>Fecha</label><input type="date" id="f_d" value="${today()}">
  <div id="xx"></div><label>Notas</label><input id="f_n">
  <button id="ok">Guardar</button><br><br><button class="s" id="cx">Cancelar</button>`);
  const tg=()=>$("xx").innerHTML=X[$("f_t").value];$("f_t").onchange=tg;tg();
  $("ok").onclick=()=>{const type=$("f_t").value,a=byId($("f_a").value),d=$("f_d").value||today();
    const x1=$("x1")?$("x1").value:"",x2=$("x2")?$("x2").value.trim():"",x3=$("x3")?$("x3").value:"";
    const r={id:uid(),aid:a.id,type,date:d,note:$("f_n").value.trim(),detail:"",result:""};
    if(type==="Servicio"){r.detail=x1+(x2?" · "+x2:"");r.bull=x2}
    if(type==="Diagnóstico"){r.result=x1;r.detail=x2;if(x1==="Preñada"){const sv=S.repro.filter(z=>z.aid===a.id&&z.type==="Servicio"&&z.date<=d).sort((p,q)=>q.date.localeCompare(p.date))[0];const pd=$("x3").value||(sv?sv.date:"");r.preg=pd;r.due=pd?addM(pd,9):""}}

  <label>Ubicación (galpón, tambo…)</label><input id="t_l" value="${esc(t.loc)}">
  <label>Responsable (trabajador)</label>${wsel(t.resp)}
  <label>Fecha de adquisición</label><input type="date" id="t_d" value="${t.date||""}">
  <label>Valor unitario (opcional)</label><input id="t_v" inputmode="decimal" value="${t.value||""}">
  <label>Notas</label><input id="t_o" value="${esc(t.note)}">
  <label>Foto</label><div class="row" style="justify-content:flex-start;gap:12px;margin-bottom:10px"><img id="tp" class="ph" style="width:64px;height:64px;${ph?"":"display:none"}" src="${ph}"><input type="file" id="t_f" accept="image/*" style="margin:0"></div>
  <button id="ok">Guardar</button><br><br>${t.id?'<button class="d" id="del">Eliminar</button><br><br>':""}<button class="s" id="cx">Cancelar</button>`);
  $("t_c").onchange=e=>{if(e.target.value!=="__new")return;const n=(prompt("Nombre del nuevo tipo")||"").trim();if(!n){e.target.value=t.cat||TCAT[0];return}
    S.meta.toolCats=S.meta.toolCats||[];if(!allCats().includes(n))S.meta.toolCats.push(n);save();const o=document.createElement("option");o.value=o.textContent=n;e.target.insertBefore(o,e.target.lastChild);e.target.value=n};
  $("t_f").onchange=e=>{const f=e.target.files[0];if(f)shrink(f,d=>{ph=d;$("tp").src=d;$("tp").style.display="block"})};
  $("ok").onclick=()=>{const name=$("t_n").value.trim();if(!name)return alert("Falta el nombre");
    const o={id:t.id||uid(),name,cat:$("t_c").value,sub:$("t_u").value.trim(),qty:+$("t_q").value||1,st:$("t_s").value,loc:$("t_l").value.trim(),resp:$("t_r").value,date:$("t_d").value,value:parseFloat($("t_v").value.replace(",","."))||0,note:$("t_o").value.trim(),photo:ph};
    if(t.id)Object.assign(t,o);else S.tools.push(o);save();fTools()};
  if(t.id)$("del").onclick=()=>{if(confirm("¿Eliminar esta herramienta?")){S.tools=S.tools.filter(x=>x!==t);save();fTools()}};
  $("cx").onclick=fTools}
function shrink(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.6))};im.onerror=()=>alert("No pude leer la foto");im.src=r.result};r.readAsDataURL(file)}
const potSel=(id,cur)=>{const L=[...new Set(["Potreron","San Bronw",...(S.meta.potList||[]),...potreros(),...(cur?[cur]:[])])];return `<select id="${id}"><option value="">— Sin potrero —</option>${L.map(p=>`<option ${p===cur?"selected":""}>${esc(p)}</option>`).join("")}<option value="__new">➕ Agregar otro…</option></select>`};
const potNew=(id,cur)=>{$(id).onchange=e=>{if(e.target.value!=="__new")return;const n=(prompt("Nombre del nuevo potrero")||"").trim();if(!n){e.target.value=cur||"";return}S.meta.potList=S.meta.potList||[];if(!S.meta.potList.includes(n))S.meta.potList.push(n);save();const o=document.createElement("option");o.textContent=n;e.target.insertBefore(o,e.target.lastChild);e.target.value=n}};
const pp=a=>{const s=rs(a.id);return s.st==="preñada"?(s.due?" · Preñada, parto "+fmt(s.due):" · Preñada, sin fecha de parto"):""};
function fPren(aid){const a=byId(aid),E=S.repro.filter(e=>e.aid===aid&&e.type==="Diagnóstico"&&e.result==="Preñada").sort((x,y)=>y.date.localeCompare(x.date))[0];if(!E)return alert("Esta vaca no tiene un diagnóstico de preñez registrado.");
  sheet(`<h1>📅 Fecha de preñez</h1><p class="mu">${nm(a)}</p><label>Fecha en que se preñó (servicio o monta)</label><input type="date" id="pg_d" value="${E.preg||""}"><div class="b" id="pg_r" style="margin:-4px 0 12px"></div><label>Fecha probable de parto (9 meses después)</label><input type="date" id="pg_p" value="${E.due||""}"><button id="ok">Guardar</button><br><br><button class="s" id="cx">Cancelar</button>`);
  const up=()=>{const d=$("pg_d").value;if(d){$("pg_p").value=addM(d,9);$("pg_r").textContent="Parto probable: "+fmt(addM(d,9))}};$("pg_d").onchange=up;$("pg_d").oninput=up;
  $("ok").onclick=()=>{const p=$("pg_p").value;if(!p)return alert("Indicá la fecha de preñez o la fecha probable de parto");E.preg=$("pg_d").value;E.due=p;save();close();render();alert("Fecha probable de parto: "+fmt(p))};$("cx").onclick=close}
function fAnimal(a){a=a||{};
  sheet(`<h1>${a.id?"Editar":"Nuevo"} animal</h1>
  <label>N.º de arete / caravana *</label><input id="f_tag" value="${esc(a.tag)}">
  <label>Nombre (opcional)</label><input id="f_name" value="${esc(a.name)}">
  <label>Categoría</label><select id="f_cat">${opts(CATS,a.cat)}</select>
  <label>Fecha de nacimiento</label><input type="date" id="f_born" value="${a.born||""}"><div class="mu" id="f_age" style="margin:-6px 0 10px"></div>
  <label>Madre (n.º de arete)</label><input id="f_mom" list="tags" value="${esc(a.mom)}">
  <label>Padre (arete o nombre del toro)</label><input id="f_dad" list="tags" value="${esc(a.dad)}">
  <label>Raza</label><input id="f_breed" value="${esc(a.breed)}">
  <label>Dueño</label><input id="f_own" list="owners" value="${esc(a.owner)}" placeholder="Ej: propio, socio, nombre"><datalist id="owners">${owners().map(o=>`<option value="${esc(o)}">`).join("")}</datalist>
  <label>Potrero / ubicación</label>${potSel("f_pot",a.pot)}
  <label>Foto</label><div class="row" style="justify-content:flex-start;gap:12px;margin-bottom:10px"><img id="pv" class="ph" style="width:64px;height:64px;${a.photo?"":"display:none"}" src="${a.photo||""}"><input type="file" id="f_ph" accept="image/*" style="margin:0"></div>
  <button id="ok">Guardar</button><br><br><button class="s" id="cx">Cancelar</button>`);
  potNew("f_pot",a.pot);
  const ag=()=>$("f_age").textContent=$("f_born").value?"Edad: "+edad($("f_born").value):"";$("f_born").oninput=ag;ag();
  let ph=a.photo||"";
  $("f_ph").onchange=e=>{const f=e.target.files[0];if(f)shrink(f,d=>{ph=d;$("pv").src=d;$("pv").style.display="block"})};
  $("ok").onclick=()=>{const tag=$("f_tag").value.trim();if(!tag)return alert("Falta la caravana");
    if(S.animals.some(x=>x.tag===tag&&x.id!==a.id&&x.status!=="baja"))return alert("Esa caravana ya existe");
    const o={id:a.id||uid(),tag,name:$("f_name").value.trim(),cat:$("f_cat").value,born:$("f_born").value,breed:$("f_breed").value.trim(),photo:ph,owner:$("f_own").value.trim(),pot:$("f_pot").value.trim(),mom:$("f_mom").value.trim(),dad:$("f_dad").value.trim(),status:a.status||"activo"};
    if(a.id)Object.assign(a,o);else S.animals.push(o);save();close();render()};
  $("cx").onclick=close}
function fSan(){
  if(!act().length)return alert("Primero cargá al menos un animal");
  sheet(`<h1>Registro sanitario</h1>
  <label>Animal</label><select id="f_a"><option value="ALL">Todo el rebaño</option>${act().map(a=>`<option value="${a.id}">#${esc(a.tag)} ${esc(a.name)}</option>`).join("")}</select>
  <label>Tipo</label><select id="f_t">${opts(SAN)}</select>
  <label>Fecha</label><input type="date" id="f_d" value="${today()}">
  <label>Producto / medicamento</label><input id="f_p">
  <label>Días de retiro (leche/carne)</label><input type="number" inputmode="numeric" id="f_r" placeholder="0">
  <label>Próxima aplicación (opcional, genera alerta)</label><input type="date" id="f_nx">
  <label>Notas</label><textarea id="f_n" rows="2"></textarea>
  <button id="ok">Guardar</button><br><br><button class="s" id="cx">Cancelar</button>`);
  $("ok").onclick=()=>{S.events.push({id:uid(),aid:$("f_a").value,type:$("f_t").value,date:$("f_d").value||today(),product:$("f_p").value.trim(),days:+$("f_r").value||0,next:$("f_nx").value,note:$("f_n").value.trim()});save();close();render()};
  $("cx").onclick=close}
function fMov(){
  sheet(`<h1>Movimiento de rebaño</h1>
  <label>Tipo</label><select id="f_t">${opts(MOV)}</select>
  <div id="gn"><label>N.º de arete / caravana *</label><input id="f_g" list="tags"></div><div id="gs"><label>Animal que sale del inventario *</label><select id="f_s">${[...act()].sort((a,b)=>a.tag.localeCompare(b.tag,"es",{numeric:true})).map(a=>`<option value="${a.id}">#${esc(a.tag)} ${esc(a.name)} · ${a.cat}</option>`).join("")}</select></div>
  <div id="nw"><label>Categoría</label><select id="f_c">${opts(CATS,"Ternera")}</select></div>
  <label>Fecha</label><input type="date" id="f_d" value="${today()}">
  <label>Madre (arete)</label><input id="f_mo" list="tags"><label>Padre (arete o toro)</label><input id="f_pa">
  <label>Potrero / ubicación</label>${potSel("f_po","")}
  <label>Monto (solo compra o venta; se registra en Caja)</label><input id="f_m" inputmode="decimal">
  <label>Nota (comprador, causa…)</label><input id="f_n">
  <button id="ok">Guardar</button><br><br><button class="s" id="cx">Cancelar</button>`);
  const tg=()=>{const n=["Nacimiento","Compra"].includes($("f_t").value);$("nw").style.display=n?"block":"none";$("gn").style.display=n?"block":"none";$("gs").style.display=n?"none":"block"};potNew("f_po","");
  $("f_t").onchange=tg;tg();
  $("ok").onclick=()=>{const type=$("f_t").value,bj=type==="Venta"||type==="Muerte",sel=bj?byId($("f_s").value):null,tag=bj?(sel?sel.tag:""):$("f_g").value.trim();if(!tag)return alert(bj?"Elegí el animal de la lista":"Falta el arete");
    const ex=bj?sel:act().find(a=>a.tag===tag),d=$("f_d").value||today();
    if(type==="Nacimiento"||type==="Compra"){if(ex)return alert("Esa caravana ya existe");
      S.animals.push({id:uid(),tag,name:"",cat:$("f_c").value,born:type==="Nacimiento"?d:"",breed:"",mom:$("f_mo").value.trim(),dad:$("f_pa").value.trim(),pot:$("f_po").value.trim(),status:"activo"})}
    else{if(!ex)return alert("No encontré un animal activo con esa caravana");ex.status="baja";ex.baja={type,date:d}}
    S.moves.push({id:uid(),type,tag,date:d,note:$("f_n").value.trim()});const mt=parseFloat($("f_m").value.replace(",","."));if(mt>0&&(type==="Venta"||type==="Compra"))S.fin.push({id:uid(),kind:type==="Venta"?"ingreso":"gasto",cat:type==="Venta"?"Venta de animales":"Compra de animales",amount:mt,date:d,note:"Arete "+tag});save();close();render()};
  $("cx").onclick=close}
function detail(a){
  const ev=S.events.filter(e=>e.aid===a.id||e.aid==="ALL").sort((x,y)=>y.date.localeCompare(x.date)),rp=S.repro.filter(e=>e.aid===a.id).sort((x,y)=>y.date.localeCompare(x.date)),st=rs(a.id);
  sheet(`${a.photo?`<img src="${a.photo}" style="width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-bottom:10px">`:""}<h1>${nm(a)}</h1><p class="mu">${a.cat}${a.born?" · Nació "+fmt(a.born):""}${a.breed?" · "+esc(a.breed):""}${a.owner?" · Dueño: "+esc(a.owner):""}</p>
  ${hv(a)}<h2>Reproducción · ${st.st}${st.due?" · parto "+fmt(st.due):""}</h2>${rp.map(e=>`<div class="card"><div class="row"><span class="b">${e.type}${e.result?" · "+e.result:""}</span><span class="mu">${fmt(e.date)}</span></div><div class="mu">${esc(e.detail)}${e.note?" · "+esc(e.note):""}</div></div>`).join("")||'<p class="mu">Sin eventos.</p>'}<h2>Historial sanitario</h2>${ev.map(e=>`<div class="card"><div class="row"><span class="b">${e.type}</span><span class="mu">${fmt(e.date)}</span></div><div class="mu">${esc(e.product)}${e.note?" · "+esc(e.note):""}</div></div>`).join("")||'<p class="mu">Sin registros.</p>'}
  ${st.st==="preñada"?'<button class="s" id="pg">📅 Fecha de preñez / parto probable</button><br><br>':""}<button id="pdfv">📄 Hoja de vida (PDF)</button><br><br><button id="ed">Editar</button><br><br><button class="d" id="del">Eliminar animal</button><br><br><button class="s" id="cx">Cerrar</button>`);
  $("ed").onclick=()=>fAnimal(a);$("pdfv").onclick=()=>pdfCV(a);if(st.st==="preñada")$("pg").onclick=()=>fPren(a.id);
  $("del").onclick=()=>{if(confirm("¿Eliminar este animal y su historial?")){S.animals=S.animals.filter(x=>x!==a);S.events=S.events.filter(e=>e.aid!==a.id);S.repro=S.repro.filter(e=>e.aid!==a.id);save();close();render()}};
  $("cx").onclick=close}
document.addEventListener("click",e=>{
  {const L=e.target.closest("a");if(L&&!L.dataset.t)return}
  const t=e.target.closest("[data-t]");if(t){e.preventDefault();tab=t.dataset.t;render();return}
  const a=e.target.closest("[data-a]");if(a){detail(byId(a.dataset.a));return}
  if(e.target.closest("[data-milk]")){fLeche(today());return}
  if(e.target.closest("[data-pl]")){pdfList();return}
  if(e.target.closest("[data-er]")){fER("mes");return}
  if(e.target.closest("[data-prof2]")){fProf();return}
  const pe=e.target.closest("[data-pe]");if(pe){const p=S.meta.people.find(x=>x.id===pe.dataset.pe);fPerson(p.kind,p);return}
  const tl=e.target.closest("[data-tl]");if(tl){fTool(S.tools.find(x=>x.id===tl.dataset.tl));return}
  const tls=e.target.closest("[data-tools]");if(tls){fTools();return}
  const pf=e.target.closest("[data-prof]");if(pf){fProf();return}
  const rb=e.target.closest("[data-rep]");if(rb){fRep();return}
  const mm=e.target.closest("[data-m]");if(mm){fm=shiftM(fm,+mm.dataset.m);render();return}
  const ff=e.target.closest("[data-f]");if(ff&&confirm("¿Eliminar este movimiento?")){S.fin=S.fin.filter(x=>x.id!==ff.dataset.f);save();render();return}
  const rr=e.target.closest("[data-r]");if(rr&&confirm("¿Eliminar este evento?")){S.repro=S.repro.filter(x=>x.id!==rr.dataset.r);save();render();return}
  const v=e.target.closest("[data-e]");if(v&&confirm("¿Eliminar este registro sanitario?")){S.events=S.events.filter(x=>x.id!==v.dataset.e);save();render();return}
  if(e.target.id==="sh")close()});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;const p=e.target.selectionStart;render();const i=$("q");i.focus();i.setSelectionRange(p,p)}});
$("gear").onclick=fSet;$("fab").onclick=()=>tab==="rebano"?fMov():tab==="animales"?fAnimal():tab==="sanidad"?fSan():tab==="repro"?fRepro():fFin();
(async()=>{try{const v=await idbGet();if(v)S=JSON.parse(v);else{const r=localStorage.getItem("tambo");if(r){S=JSON.parse(r);save()}}}catch(e){}
  norm();render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{})})();
</script>
</body>
