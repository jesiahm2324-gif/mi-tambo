<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Tambo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f4d3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" id="ati" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Mi Tambo</title>
<style>
:root{--bg:#eceee9;--card:#fff;--tx:#14231b;--mu:#5d6c63;--pr:#1f4d3a;--pt:#fff;--bd:#d8ddd5;--ac:#a8832f;--wa:#b3382c;--wb:#fbeceb;--sh:0 1px 2px #14231b0d,0 6px 18px -8px #14231b26;--sf:ui-serif,"New York",Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1511;--card:#15201a;--tx:#e8efe9;--mu:#91a196;--pr:#62b588;--pt:#07120c;--bd:#24322a;--ac:#d0a94f;--wa:#ff8f80;--wb:#33201d;--sh:0 1px 2px #0006,0 8px 20px -10px #000a}}
:root[data-theme="dark"]{--bg:#0d1511;--card:#15201a;--tx:#e8efe9;--mu:#91a196;--pr:#62b588;--pt:#07120c;--bd:#24322a;--ac:#d0a94f;--wa:#ff8f80;--wb:#33201d;--sh:0 1px 2px #0006,0 8px 20px -10px #000a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{padding:18px 16px 118px;max-width:640px;margin:auto}
h1{font:600 30px/1.1 var(--sf);letter-spacing:-.01em;margin:6px 0 14px}
h2{font:600 17px/1.2 var(--sf);color:var(--tx);margin:24px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:13px 15px;margin-bottom:9px;box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .row>span:last-child{white-space:nowrap}
.card .row>*:first-child{min-width:0}.card .row .b{overflow-wrap:anywhere}
.mu{color:var(--mu);font-size:14px}.b{font-weight:600}
.warn{background:var(--wb);color:var(--wa);border-color:var(--wa);box-shadow:none}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:11px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:4px}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;background:var(--pr);color:var(--pt);font-weight:600;letter-spacing:.01em;width:100%}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--wb);color:var(--wa)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:4}
nav a{flex:1;text-align:center;padding:7px 0 6px;font-size:11px;color:var(--mu);text-decoration:none;position:relative}
nav a b{display:block;font-size:20px;filter:grayscale(1);opacity:.65}
nav a.on{color:var(--pr);font-weight:700}nav a.on b{filter:none;opacity:1}
nav a.on::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:2px;border-radius:2px;background:var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:auto;border-radius:30px;padding:14px 22px;background:var(--ac);color:#1a1405;box-shadow:0 8px 20px -6px #0006;z-index:4}
#sh{position:fixed;inset:0;background:#0a120d99;display:none;align-items:flex-end;z-index:9}
#sh>div{background:var(--bg);width:100%;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){#sh>div{animation:none}}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:12px;margin-left:6px;color:var(--mu)}
.rt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.rt td{padding:7px 0;border-bottom:1px solid var(--bd)}.rt td:last-child{text-align:right;font-weight:600}
.ph{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--bd);flex:none}
.ph.lg{width:58px;height:58px;border-radius:50%;object-position:50% 35%}
.ph0{display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--bg);filter:grayscale(1);opacity:.6}
.ac{display:flex;gap:12px;align-items:center;padding:9px 12px;margin-bottom:7px}.am{flex:1;min-width:0}
.an{font:600 17px/1.15 var(--sf)}.ar{font-size:14px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}.ae{font-size:13px;color:var(--pr)}.sm{font-size:12.5px;margin-top:4px}
[data-prof] .ph{box-shadow:0 0 0 2px var(--ac);border:0}
.ib{width:auto;padding:8px 13px;border-radius:20px;background:var(--card);color:var(--tx);border:1px solid var(--bd);font-size:18px;box-shadow:var(--sh)}
.gear{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:14px;width:auto;padding:7px 11px;border-radius:20px;background:var(--card);color:var(--tx);border:1px solid var(--bd);z-index:5;font-size:17px;box-shadow:var(--sh)}
input[type=date]{display:block;min-width:0;max-width:100%;min-height:46px;-webkit-appearance:none;appearance:none}
#shc{overflow-x:hidden}
.g{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}.g .card{margin:0}.g .b{font-family:var(--sf)}
.big{font:600 34px/1 var(--sf);color:var(--pr)}

/* ===== Diseño moderno ===== */
:root{--prd:#123226;--hero1:#14382a;--hero2:#1f5a43;--hero3:#2f7f5c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--prd:#2b6f4e}}
:root[data-theme="dark"]{--prd:#2b6f4e}
html,body{background-color:var(--bg)}
body{background-image:radial-gradient(520px 320px at 100% 0,#a8832f1c,transparent),radial-gradient(520px 360px at 0 0,#1f4d3a1c,transparent);background-repeat:no-repeat}
main{padding-top:14px}
h1{font-size:28px;letter-spacing:-.02em}
main>h1:first-child,.row>h1{position:relative;padding-left:14px}
main>h1:first-child::before,.row>h1::before{content:"";position:absolute;left:0;top:.14em;bottom:.14em;width:5px;border-radius:4px;background:linear-gradient(var(--ac),var(--pr))}
h2{border:0;padding:0 0 0 10px;margin:22px 0 10px;border-left:4px solid var(--ac);font-size:16px}
.card{border-radius:18px;border-bottom:3px solid color-mix(in srgb,var(--bd) 60%,var(--pr) 40%);background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,#fff 8%),var(--card));transition:transform .08s,box-shadow .08s}
.card.warn{border-bottom-color:var(--wa)}
.card[data-a]:active,.card[data-e]:active,.card[data-r]:active,.card[data-f]:active,.card[data-sec]:active,.card[data-al]:active{transform:translateY(2px)}
button{box-shadow:0 3px 0 var(--prd),0 10px 16px -8px #0006;border-radius:15px;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 0 0 var(--prd)}
button.s{box-shadow:0 2px 0 var(--bd)}button.d{box-shadow:0 2px 0 color-mix(in srgb,var(--wa) 40%,transparent)}
.ib{box-shadow:0 2px 0 var(--bd),var(--sh)}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:616px;margin:auto;border:1px solid var(--bd);border-radius:28px;padding:6px;box-shadow:0 14px 34px -12px #000a,0 2px 0 var(--bd)}
nav a{border-radius:22px;padding:7px 0 5px;transition:background .15s}
nav a.on{background:color-mix(in srgb,var(--pr) 14%,transparent)}nav a.on::after{display:none}
nav a b{font-size:21px;margin-bottom:1px}
.fab{bottom:calc(92px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#d9b45a,var(--ac));box-shadow:0 4px 0 #7b5f1f,0 14px 24px -8px #0008;font-weight:700}
.fab:active{box-shadow:0 1px 0 #7b5f1f}
.gear{position:absolute;top:calc(env(safe-area-inset-top,0px) + 26px);right:28px;background:#ffffff26;color:#fff;border:1px solid #ffffff55;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:none}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px 16px;margin:0 0 14px;color:#fff;background:radial-gradient(280px 170px at 100% 0,#ffd76a66,transparent),radial-gradient(240px 160px at 0 100%,#2fd4a055,transparent),linear-gradient(150deg,#1f7a52,#17653f 55%,#0f4a35);box-shadow:0 4px 0 var(--prd),0 18px 30px -14px #0009}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:30px solid #ffffff0d}
.hero .ph{width:62px;height:62px;border:0;box-shadow:0 0 0 3px #d0a94f,0 6px 14px -4px #0008}
.hero .hl{display:flex;align-items:center;gap:14px;position:relative;z-index:1;padding-right:46px}
.hero .lg0{width:62px;height:62px;border-radius:50%;background:#ffffff1f;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 0 0 3px #d0a94f;flex:none}
.hero .eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#e9d08a;font-weight:700}
.hero h1{margin:2px 0 2px;color:#fff;padding:0;font-size:25px;line-height:1.1}.hero h1::before{display:none}
.hero .sb{font-size:13px;color:#ffffffb8;overflow-wrap:anywhere}
.hero .ks{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:16px;position:relative;z-index:1}
.hero .k{background:#ffffff1a;border:1px solid #ffffff26;border-radius:14px;padding:8px 4px 7px;text-align:center;box-shadow:inset 0 -3px 0 #0003}
.hero .k b{display:block;font:700 21px/1.05 var(--sf);font-variant-numeric:tabular-nums}.hero .k.w{background:#ffb4a826;border-color:#ffb4a866}
.hero .k span{display:block;font-size:10.5px;letter-spacing:.04em;color:#ffffffc4;margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{margin:0!important;padding:13px 12px 12px!important;display:flex;flex-direction:column;gap:7px;min-height:104px}
.tile .ti{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 3px 0 var(--c3),0 8px 12px -6px #0006;color:#fff}
.tile .tt{font:600 15.5px/1.15 var(--sf)}.tile .ts{font-size:12.5px;color:var(--mu);margin-top:-3px}
.tile.warn .ts{color:inherit;opacity:.9}
.cr{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--bd)}.cr:last-child{border:0}
.cr>span:first-child{flex:0 0 46%;font-size:15px}.cr b{font:600 18px/1 var(--sf);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.cb{flex:1;height:9px;border-radius:6px;background:color-mix(in srgb,var(--bd) 70%,transparent);overflow:hidden;box-shadow:inset 0 1px 2px #0002}.cb i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pr),var(--ac))}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--pr);border-bottom:3px solid color-mix(in srgb,var(--bd) 60%,var(--pr) 40%);border-radius:16px;padding:10px 12px;box-shadow:var(--sh)}
.kpi .kl{font-size:12px;color:var(--mu);letter-spacing:.02em}.kpi .kv{font:700 25px/1.1 var(--sf);font-variant-numeric:tabular-nums;margin-top:2px}.kpi .kn{font-size:12px;color:var(--mu);margin-top:2px}
.kpi.k-g{border-top-color:#2f9d62}.kpi.k-y{border-top-color:#d0a94f}.kpi.k-r{border-top-color:var(--wa)}
.chart{background:var(--card);border:1px solid var(--bd);border-bottom:3px solid color-mix(in srgb,var(--bd) 60%,var(--pr) 40%);border-radius:16px;padding:10px 6px 4px;margin-bottom:10px;box-shadow:var(--sh)}
.chart .ct{font:600 14px/1.2 var(--sf);padding:0 8px 4px}.chart svg{width:100%;height:auto;display:block}.chart text{fill:var(--mu)}


/* ===== Inicio renovado ===== */
nav a b{display:flex;justify-content:center;filter:none;opacity:1;font-size:inherit;margin-bottom:2px}nav a b svg{width:24px;height:24px;opacity:.7}nav a.on b svg{opacity:1}
.ic{display:block;flex:none}
.tile .ti svg{width:23px;height:23px}

.hero .tt0{display:flex;align-items:center;gap:14px;margin-top:16px;position:relative;z-index:1}
.hero .tg{width:54px;height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#ffd76a,#e0a41f);color:#4a3200;box-shadow:0 3px 0 #8a5d00,0 8px 14px -6px #0007}.hero .tg svg{width:30px;height:30px}
.hero .tl{font:600 14px var(--sf);color:#fff;opacity:.9}.hero .tn{font:700 46px/1 var(--sf);font-variant-numeric:tabular-nums;letter-spacing:-1px;text-shadow:0 2px 0 #0003}
.hero .tc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;position:relative;z-index:1}
.hero .tk{position:relative;display:flex;align-items:center;gap:6px;background:var(--card);color:var(--tx);border-radius:13px;padding:8px 10px 12px 12px;font-size:12.5px;overflow:hidden;box-shadow:0 2px 0 #0003;border-left:5px solid var(--k)}
.hero .tk .tkn{flex:1;line-height:1.1;font-weight:600}.hero .tk b{font:700 20px var(--sf);font-variant-numeric:tabular-nums;color:var(--tx)}
.hero .tk i{position:absolute;left:12px;bottom:5px;height:4px;border-radius:4px;width:calc((100% - 24px)*var(--w)/100%);min-width:4px;background:var(--k)}
.hero .tk.tt{background:linear-gradient(145deg,#ffd76a,#e0a41f);color:#3d2800;border-left:0;padding:8px 12px;box-shadow:0 3px 0 #8a5d00}.hero .tk.tt .tkn{font-weight:700}.hero .tk.tt b{color:#3d2800;font-size:26px;line-height:1}.hero .tk.tt .tg{width:30px;height:30px;border-radius:10px;background:#3d28001f;box-shadow:none;color:#3d2800}.hero .tk.tt .tg svg{width:19px;height:19px}
.rh{padding:14px;background:linear-gradient(150deg,color-mix(in srgb,var(--card) 86%,#e0709a 14%),var(--card) 70%)}
.rr{display:flex;align-items:center;gap:14px}.rg2{width:118px;height:118px;flex:none;filter:drop-shadow(0 4px 6px #0003)}.rn1{font:700 22px var(--sf);fill:var(--tx)}.rn2{font-size:8.5px;fill:var(--mu)}
.rx{flex:1;min-width:0;cursor:pointer}.rx .rl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mu)}.rx .rb{font:700 17px/1.2 var(--sf);margin-top:2px;overflow-wrap:anywhere}.rx .rd{font:600 14px var(--sf);color:var(--pr);margin:2px 0 6px}.rx .rs{font-size:12.5px;color:var(--mu);margin-top:5px}.rx .rs b{color:var(--tx)}
.pbar{height:8px;border-radius:6px;background:color-mix(in srgb,var(--bd) 70%,transparent);overflow:hidden;box-shadow:inset 0 1px 2px #0002}.pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#e0709a,#c23f78)}.pbar.g i{background:linear-gradient(90deg,#52c58a,#2a8a5a)}.pbar.y i{background:linear-gradient(90deg,#f3c85a,#c79322)}.pbar.r i{background:linear-gradient(90deg,#ff9a8a,#d9483a)}
.rts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.rt4{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:13px 13px 12px;box-shadow:var(--sh),0 3px 0 color-mix(in srgb,var(--c2) 35%,transparent);cursor:pointer;overflow:hidden;transition:transform .12s;-webkit-tap-highlight-color:transparent}.rt4:active{transform:translateY(2px) scale(.98)}
.rt4::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c1) 30%,transparent),transparent 70%)}
.rt4 .mg{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 2px 0 var(--c3),0 6px 10px -6px #0006}.rt4 .mg svg{width:20px;height:20px}
.rt4 .rv{font:700 38px/1 var(--sf);font-variant-numeric:tabular-nums;margin:10px 0 2px;color:var(--c2)}.rt4 .rlb{font-size:13px;color:var(--mu);min-height:32px;line-height:1.2}
.rt4 .rb2{height:5px;border-radius:5px;background:color-mix(in srgb,var(--bd) 70%,transparent);margin-top:6px;overflow:hidden}.rt4 .rb2 i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--c1),var(--c2));min-width:3px}
.pp{padding:11px 14px}.pp .pbar{margin-top:8px}.pill{font-size:12.5px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}.pill.g{background:#2a8a5a26;color:#2a8a5a}.pill.y{background:#c7932226;color:#a8761a}.pill.r{background:#d9483a26;color:var(--wa)}

/* ===== pulido general ===== */
#app.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.04s}#app.enter>*:nth-child(3){animation-delay:.08s}#app.enter>*:nth-child(4){animation-delay:.12s}#app.enter>*:nth-child(5){animation-delay:.16s}#app.enter>*:nth-child(6){animation-delay:.2s}#app.enter>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
@media(prefers-reduced-motion:reduce){#app.enter>*{animation:none}}
#sh{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}#sh>div::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:var(--bd);margin:-8px auto 14px}
.sr{position:relative;margin-bottom:10px}.sr span{position:absolute;left:14px;top:50%;transform:translateY(-62%);color:var(--mu);display:flex;pointer-events:none}.sr svg{width:19px;height:19px}.sr input{margin:0;padding-left:44px;border-radius:16px;box-shadow:var(--sh)}
.chs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}.chs::-webkit-scrollbar{display:none}
.chp{width:auto;flex:none;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:20px;background:var(--card);color:var(--tx);border:1px solid var(--bd);font:600 13.5px var(--sans,inherit);box-shadow:var(--sh);transition:transform .12s}.chp:active{transform:scale(.96)}
.chp i{width:9px;height:9px;border-radius:50%;background:var(--k)}.chp b{font-weight:700;font-variant-numeric:tabular-nums;opacity:.65}
.chp.on{background:var(--k);color:#fff;border-color:transparent;box-shadow:0 3px 0 color-mix(in srgb,var(--k) 55%,#000)}.chp.on i{background:#fff}.chp.on b{opacity:.9}
.av{display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c))!important;filter:none!important;opacity:1!important;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 55%,#000)}.av svg{width:30px;height:30px}
.cp{font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pg{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:11.5px;font-weight:700;color:#d1457f;background:#e0558c1f;border-radius:12px;padding:1px 8px}.pg svg{width:12px;height:12px}
.ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;color:#fff;transition:all .15s}.ck.on{background:var(--pr);border-color:var(--pr)}.ck svg{width:16px;height:16px}

const PUBK={"kty": "EC", "crv": "P-256", "x": "5KgEFPis3DHEpfHboTJSAIN9N7BgrAF53p3MncLovqU", "y": "DHbX3Zo7Q5j_0lfRXakjDEzRz40JBgjwXMCsyrLPZWo"};

const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u=t=>{t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const b=atob(t),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};

let LIC=null;
async function licCheck(code){
  try{code=String(code||"").replace(/\s+/g,"");const [p,sg]=code.split(".");if(!p||!sg)return{st:"bad"};
    const key=await crypto.subtle.importKey("jwk",PUBK,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    if(!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,unb64u(sg),new TextEncoder().encode(p)))return{st:"bad"};
    const d=JSON.parse(new TextDecoder().decode(unb64u(p)));

    const t=nowD();if(d.e&&t>d.e)return{st:"exp",name:d.n,exp:d.e};
    return{st:"ok",name:d.n,exp:d.e||"",days:d.e?dd(d.e,t):null}}
  catch(e){return{st:"bad"}}}
