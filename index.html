<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Tambo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f4d3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" id="ati" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Mi Tambo</title>
<style>
:root{--bg:#eceee9;--card:#fff;--tx:#14231b;--mu:#5d6c63;--pr:#1f4d3a;--pt:#fff;--bd:#d8ddd5;--ac:#a8832f;--wa:#b3382c;--wb:#fbeceb;--sh:0 1px 2px #14231b0d,0 6px 18px -8px #14231b26;--sf:ui-serif,"New York",Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1511;--card:#15201a;--tx:#e8efe9;--mu:#91a196;--pr:#62b588;--pt:#07120c;--bd:#24322a;--ac:#d0a94f;--wa:#ff8f80;--wb:#33201d;--sh:0 1px 2px #0006,0 8px 20px -10px #000a}}
:root[data-theme="dark"]{--bg:#0d1511;--card:#15201a;--tx:#e8efe9;--mu:#91a196;--pr:#62b588;--pt:#07120c;--bd:#24322a;--ac:#d0a94f;--wa:#ff8f80;--wb:#33201d;--sh:0 1px 2px #0006,0 8px 20px -10px #000a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{padding:18px 16px 118px;max-width:640px;margin:auto}
h1{font:600 30px/1.1 var(--sf);letter-spacing:-.01em;margin:6px 0 14px}
h2{font:600 17px/1.2 var(--sf);color:var(--tx);margin:24px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:13px 15px;margin-bottom:9px;box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .row>span:last-child{white-space:nowrap}
.card .row>*:first-child{min-width:0}.card .row .b{overflow-wrap:anywhere}
.mu{color:var(--mu);font-size:14px}.b{font-weight:600}
.warn{background:var(--wb);color:var(--wa);border-color:var(--wa);box-shadow:none}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:11px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:4px}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;background:var(--pr);color:var(--pt);font-weight:600;letter-spacing:.01em;width:100%}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--wb);color:var(--wa)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:4}
nav a{flex:1;text-align:center;padding:7px 0 6px;font-size:11px;color:var(--mu);text-decoration:none;position:relative}
nav a b{display:block;font-size:20px;filter:grayscale(1);opacity:.65}
nav a.on{color:var(--pr);font-weight:700}nav a.on b{filter:none;opacity:1}
nav a.on::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:2px;border-radius:2px;background:var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:auto;border-radius:30px;padding:14px 22px;background:var(--ac);color:#1a1405;box-shadow:0 8px 20px -6px #0006;z-index:4}
#sh{position:fixed;inset:0;background:#0a120d99;display:none;align-items:flex-end;z-index:9}
#sh>div{background:var(--bg);width:100%;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){#sh>div{animation:none}}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:12px;margin-left:6px;color:var(--mu)}
.rt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.rt td{padding:7px 0;border-bottom:1px solid var(--bd)}.rt td:last-child{text-align:right;font-weight:600}
.ph{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--bd);flex:none}
.ph.lg{width:58px;height:58px;border-radius:50%;object-position:50% 35%}
.ph0{display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--bg);filter:grayscale(1);opacity:.6}
.ac{display:flex;gap:12px;align-items:center;padding:9px 12px;margin-bottom:7px}.am{flex:1;min-width:0}
.an{font:600 17px/1.15 var(--sf)}.ar{font-size:14px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}.ae{font-size:13px;color:var(--pr)}.sm{font-size:12.5px;margin-top:4px}
[data-prof] .ph{box-shadow:0 0 0 2px var(--ac);border:0}
.gear{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:14px;width:auto;padding:7px 11px;border-radius:20px;background:var(--card);color:var(--tx);border:1px solid var(--bd);z-index:5;font-size:17px;box-shadow:var(--sh)}
input[type=date]{display:block;min-width:0;max-width:100%;min-height:46px;-webkit-appearance:none;appearance:none}
#shc{overflow-x:hidden}
.g{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}.g .card{margin:0}.g .b{font-family:var(--sf)}
.big{font:600 34px/1 var(--sf);color:var(--pr)}
</style>
</head>
<body>
<main id="app"></main>
<button class="gear" id="gear">⚙️</button><datalist id="tags"></datalist><datalist id="pots"></datalist>
<button class="fab" id="fab">+ Nuevo</button>
<nav id="nav"></nav>
<div id="sh"><div id="shc"></div></div>
<script>
const CAT0=["Vaca en ordeñe","Vaca seca","Vaquillona","Ternera","Ternero","Novillo","Toro"],CATS=[...CAT0];
const isM=c=>["Ternero","Novillo","Toro"].includes(c)||(S.meta.catList||[]).some(x=>x.name===c&&x.male);
const SAN=["Vacunación","Tratamiento","Mastitis","Desparasitación","Control veterinario"];
const MOV=["Nacimiento","Compra","Venta","Muerte"];
let aLim=50,PZ={};let S={animals:[],events:[],moves:[]},tab="rebano",q="";
const norm=()=>{S.animals=S.animals||[];S.animals.forEach(a=>{if(a.owner){const o=["Adela Mejia","Jairo Mejia","Enrrique Mejia"].find(x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()===a.owner.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim());if(o)a.owner=o}});S.animals=S.animals||[];S.events=S.events||[];S.moves=S.moves||[];S.repro=S.repro||[];S.fin=S.fin||[];S.meta=S.meta||{};S.tools=S.tools||[];S.milk=S.milk||[];S.potlog=S.potlog||[];CATS.length=0;CATS.push(...CAT0,...(S.meta.catList||[]).map(c=>c.name));if(!S.meta.milkGal){const f=cfg().unit==="gal"?(+cfg().gl||4):3.785;S.milk.forEach(m=>{m.l=Math.round(m.l/f*10)/10});S.meta.milkGal=true}linkPairs()};
const IDB=()=>new Promise((res,rej)=>{const r=indexedDB.open("mitambo",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=async()=>{const d=await IDB();return new Promise((res,rej)=>{const q=d.transaction("kv").objectStore("kv").get("S");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const idbSet=async v=>{const d=await IDB();return new Promise((res,rej)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,"S");t.oncomplete=res;t.onerror=()=>rej(t.error)})};
norm();
let svT=0;const save=()=>{const v=JSON.stringify(S);clearTimeout(svT);svT=setTimeout(()=>idbSet(v).catch(()=>{try{localStorage.setItem("tambo",v)}catch(e){alert("No se pudo guardar. Revisá el espacio del teléfono y hacé un respaldo.")}}),150)};
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?d.split("-").reverse().join("/"):"";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const owners=()=>[...new Set(S.animals.map(a=>a.owner).filter(Boolean))].sort();
const act=()=>S.animals.filter(a=>a.status!=="baja");
const byId=id=>id==="ALL"?{ALL:1}:S.animals.find(a=>a.id===id);
const nm=a=>a&&a.ALL?"Todo el rebaño":a?("#"+esc(a.tag)+(a.name?" "+esc(a.name):"")):"(eliminado)";
function until(e){if(!e.days)return null;const d=new Date(e.date+"T00:00");d.setDate(d.getDate()+ +e.days);return d.toISOString().slice(0,10)}
const opts=(a,sel)=>a.map(x=>`<option ${x===sel?"selected":""}>${x}</option>`).join("");

function alerts(){
  const t=today(),L=[];
  fem().forEach(a=>{const s=rs(a.id);if(s.st==="preñada"&&s.due){const r=dd(s.due,t);if(r<=AD())L.push({k:"parto",r,i:"🐄",t:"Parto: "+raw(a),d:s.due,aid:a.id})}else if((s.st==="parida"||s.st==="vacía")&&s.lp){const dp=dd(t,s.lp),lim=+cfg().vac||90;if(dp>=lim)L.push({k:"vacia",r:lim-dp,i:"⚠️",t:"Vacía: "+raw(a),d:s.lp,aid:a.id,m:dp+" d sin preñez"})}});
  const PL=vacPlan();PL.forEach(p=>{const l=lastApp(p.name);if(!l)return;const due=addM(l.date,p.months),r=dd(due,t);if(r<=AD())L.push({k:"vac",r,i:"💉",t:"Vacuna "+p.name+": "+(l.aid==="ALL"?"todo el rebaño":raw(byId(l.aid))),d:due,aid:l.aid==="ALL"?null:l.aid})});
  S.events.forEach(e=>{if(!e.next)return;const pr=(e.product||"").toLowerCase();if(PL.some(p=>p.name.trim().toLowerCase()===pr.trim()))return;
    if(S.events.some(x=>x!==e&&x.aid===e.aid&&x.type===e.type&&(x.product||"").toLowerCase()===pr&&x.date>e.date))return;
    const r=dd(e.next,t);if(r<=AD())L.push({k:"vac",r,i:"💉",t:e.type+(e.product?" · "+e.product:"")+": "+raw(byId(e.aid)),d:e.next,aid:e.aid})});
  return L.sort((a,b)=>a.r-b.r)}
function alHtml(L,nohead){
  if(!L.length)return "";
  const w=r=>r<0?"vencida hace "+(-r)+" d":r===0?"¡hoy!":"en "+r+" d";
  return (nohead?"":`<h2>🔔 Alertas (${L.length})</h2>`)+L.map(x=>`<div class="card ${x.r<=7?"warn":""}" ${x.aid&&x.aid!=="ALL"?`data-a="${x.aid}"`:""}><div class="b">${x.i} ${esc(x.t)}</div><div class="row" style="margin-top:3px"><span style="opacity:.8">${x.k==="vacia"?"Último parto: ":""}${fmt(x.d)}</span><span>${x.m||w(x.r)}</span></div></div>`).join("")}
const alCard=L=>{if(!L.length)return"";const n=k=>L.filter(x=>x.k===k).length,u=L.filter(x=>x.r<=7&&x.k!=="vacia").length;
  return `<div class="card ${u?"warn":""}" data-al><div class="row"><span class="b">🔔 Alertas (${L.length})</span><span>›</span></div><div class="mu" style="${u?"color:inherit;opacity:.9":""}">${[n("parto")?n("parto")+(n("parto")>1?" partos":" parto"):"",n("vac")?n("vac")+(n("vac")>1?" vacunas":" vacuna"):"",n("vacia")?n("vacia")+(n("vacia")>1?" vacías":" vacía"):""].filter(Boolean).join(" · ")}${u?" · "+u+(u>1?" urgentes":" urgente"):""}</div></div>`};
function fAlertas(){const L=alerts(),G=[["parto","🐄 Partos próximos"],["vac","💉 Vacunas y medicamentos"],["vacia","⚠️ Vacías sin preñez"]];
  sheet(`<h1>🔔 Alertas (${L.length})</h1>${G.map(([k,t])=>{const l=L.filter(x=>x.k===k);return l.length?`<h2>${t} (${l.length})</h2>${alHtml(l,1)}`:""}).join("")||'<p class="mu">No hay alertas.</p>'}<br><button class="s" id="cx">Cerrar</button>`);$("cx").onclick=close}
function setIcon(){const l=$("ati"),lg=(S.meta.prof||{}).logo||"icon-180.png";if(l&&l.getAttribute("href")!==lg)l.setAttribute("href",lg)}
function render(){
  norm();setIcon();$("gear").style.display=tab==="rebano"?"":"none";$("tags").innerHTML=S.animals.map(a=>`<option value="${esc(a.tag)}">${esc(a.name)}</option>`).join("");$("pots").innerHTML=potreros().map(p=>`<option value="${esc(p)}">`).join("");
  const NA=alerts().length;
  const tabs=[["rebano","🐄","Rebaño"],["animales","🏷️","Animales"],["sanidad","💉","Sanidad"],["repro","🤰","Preñez"],["caja","💰","Caja"]];
  $("nav").innerHTML=tabs.map(t=>`<a href="#" data-t="${t[0]}" class="${tab===t[0]?"on":""}"><b>${t[1]}</b>${t[2]}${t[0]==="rebano"&&NA?` <span style="background:var(--wa);color:var(--pt);border-radius:9px;padding:0 6px;font-size:11px">${NA}</span>`:""}</a>`).join("");
  $("fab").textContent=tab==="rebano"?"+ Movimiento":tab==="animales"?"+ Animal":tab==="sanidad"?"+ Sanidad":tab==="repro"?"+ Evento":"+ Ingreso/Gasto";
  $("app").innerHTML=tab==="rebano"?vRebano():tab==="animales"?vAnimales():tab==="sanidad"?vSanidad():tab==="repro"?vRepro():vCaja();
}
function vRebano(){
  const A=act(),c={};A.forEach(a=>c[a.cat]=(c[a.cat]||0)+1);
  const m=[...S.moves].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
  const AL=alerts(),inv=invRows("mes");
  const lb=S.meta.lastBackup,old=!lb||dd(today(),lb)>30;
  return `${hdr()}<div class="card ${old?"warn":""}" data-rep><div class="row"><span class="b">📊 Reportes y respaldo</span><span>›</span></div><div class="mu">${lb?"Último respaldo: "+fmt(lb):"Todavía no hiciste un respaldo"}</div></div><div class="card" data-milk><div class="row"><span class="b">🥛 Producción de leche</span><span>hoy ${fmtMilk(milkToday())} ›</span></div></div><div class="card" data-tools><div class="row"><span class="b">🛠️ Herramientas de la finca</span><span>${S.tools.length} ›</span></div></div>${alCard(AL)}<div class="card"><div class="mu">Total de animales</div><div class="big">${A.length}</div></div>
  <div class="g">${CATS.map(k=>`<div class="card"><div class="mu">${k}</div><div class="b" style="font-size:22px">${c[k]||0}</div></div>`).join("")}</div>
  ${plg2("inv","📦 Inventario del mes",`<div class="card"><table class="rt">${inv.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table></div>`,"Inicial "+inv[0][1]+" · Final "+inv[5][1])}
  ${plg2("mov","📝 Últimos movimientos ("+S.moves.length+")",m.map(x=>`<div class="card"><div class="row"><span class="b">${x.type}</span><span class="mu">${fmt(x.date)}</span></div><div class="mu">#${esc(x.tag)}${x.note?" · "+esc(x.note):""}</div></div>`).join("")||'<p class="mu">Sin movimientos todavía.</p>',m[0]?m[0].type+" · #"+esc(m[0].tag)+" · "+fmt(m[0].date):"Sin movimientos todavía")}`;
}
function vAnimales(){
  const all=act().filter(a=>(a.tag+" "+a.name+" "+a.cat+" "+(a.owner||"")).toLowerCase().includes(q.toLowerCase())).sort(byAge),l=all.slice(0,aLim);
  return `<h1>Animales</h1><div class="g" style="margin-bottom:12px"><button class="s" data-pl style="font-size:14px;padding:11px 6px">📄 Listado</button><button class="s" data-po style="font-size:14px;padding:11px 6px">📄 Por dueño</button><button class="s" data-pd style="font-size:14px;padding:11px 6px">🗑️ Descarte</button><button class="s" data-ps style="font-size:14px;padding:11px 6px">🏷️ Sin arete</button></div><input id="q" placeholder="Buscar caravana, nombre o categoría" value="${esc(q)}">
  ${l.map(a=>`<div class="card ac" data-a="${a.id}">${a.photo?`<img class="ph lg" src="${a.photo}">`:'<div class="ph lg ph0">🐄</div>'}<div class="am"><div class="row"><span class="b an">${esc(a.name)||"Sin nombre"}${rs(a.id).st==="preñada"?" 🤰":""}</span><span class="tag">${a.cat}</span></div><div class="ar">Arete ${esc(a.tag)}</div><div class="ae">${a.born?edad(a.born):"Sin fecha de nacimiento"}</div></div></div>`).join("")||'<p class="mu">No hay animales cargados.</p>'}${all.length>l.length?`<p class="mu" style="text-align:center">Mostrando ${l.length} de ${all.length}</p><button class="s" data-more>Ver más animales</button>`:all.length?`<p class="mu" style="text-align:center">${all.length} animales</p>`:""}`;
}
function vSanidad(){
  const t=today(),r=S.events.filter(e=>until(e)&&until(e)>=t);
  const l=[...S.events].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);
  const VA=alerts().filter(x=>x.k==="vac");
  return `<h1>Sanidad</h1><button class="s" data-plan>📋 Plan anual de vacunas</button><br><br>${VA.length?`<h2>Próximas aplicaciones (30 días)</h2>${alHtml(VA,1)}`:""}
  ${r.length?`<h2>En período de retiro</h2>${r.map(e=>`<div class="card warn"><div class="b">${nm(byId(e.aid))}</div><div>${e.type}${e.product?" · "+esc(e.product):""}</div><div>No enviar leche/carne hasta el ${fmt(until(e))}</div></div>`).join("")}`:""}
  <h2>Historial</h2>${l.map(e=>`<div class="card" data-e="${e.id}"><div class="row"><span class="b">${nm(byId(e.aid))}</span><span class="mu">${fmt(e.date)}</span></div><div>${e.type}${e.product?" · "+esc(e.product):""}</div>${e.note?`<div class="mu">${esc(e.note)}</div>`:""}</div>`).join("")||'<p class="mu">Sin registros sanitarios.</p>'}`;
}
const GEST=283,FEM=["Vaca en ordeñe","Vaca seca","Vaquillona"];
const fem=()=>act().filter(a=>FEM.includes(a.cat));
const ymd=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
const addD=(d,n)=>{const x=new Date(d+"T00:00");x.setDate(x.getDate()+n);return ymd(x)};
const addM=(d,n)=>{const x=new Date(d+"T00:00"),k=x.getDate();x.setMonth(x.getMonth()+n);if(x.getDate()!==k)x.setDate(0);return ymd(x)};
const dd=(a,b)=>Math.round((new Date(a+"T00:00")-new Date(b+"T00:00"))/864e5);
function rs(aid){let s={st:"sin datos"};const A0=byId(aid),ev=S.repro.filter(r=>r.aid===aid);if(A0&&A0.id){const real=ev.filter(r=>r.type==="Parto").map(r=>r.date);births(A0).forEach(d=>{if(!real.includes(d))ev.push({type:"Parto",date:d})})}
  ev.sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
    if(r.type==="Servicio")s={st:"servida",svc:r.date,lp:s.lp,bull:r.bull};
    else if(r.type==="Diagnóstico")s=r.result==="Preñada"?{...s,st:"preñada",due:r.due||(s.svc?addM(s.svc,9):null),bull:r.bull||s.bull}:{st:"vacía",lp:s.lp};
    else if(r.type==="Parto")s={st:"parida",lp:r.date};
    else if(r.type==="Aborto")s={st:"vacía",lp:s.lp}});
  return s}

  <label>Categoría</label>${catSel("f_cat",a.cat)}
  <label>Fecha de nacimiento</label><input type="date" id="f_born" value="${a.born||""}"><div class="mu" id="f_age" style="margin:-6px 0 10px"></div>
  <label>Madre (n.º de arete)</label>${parSel("f_mom",a.mom,0,a.id)}
  <label>Padre (arete o nombre del toro)</label>${parSel("f_dad",a.dad,1,a.id)}
  <label>Raza</label><input id="f_breed" value="${esc(a.breed)}">
  <label>Dueño</label>${lsel("f_own",a.owner,[...OWN,...owners()],"ownList","— Sin dueño —")}
  <label>Potrero / ubicación</label>${potSel("f_pot",a.pot)}
  <label>Nota</label><textarea id="f_note" rows="2" placeholder="Observaciones del animal">${esc(a.note)}</textarea>
  <label>Foto</label><div class="row" style="justify-content:flex-start;gap:12px;margin-bottom:10px"><img id="pv" class="ph" style="width:64px;height:64px;${a.photo?"":"display:none"}" src="${a.photo||""}"><input type="file" id="f_ph" accept="image/*" style="margin:0"></div>
  <button id="ok">Guardar</button><br><br><button class="s" id="cx">Cancelar</button>`);
  catNew("f_cat",a.cat);potNew("f_pot",a.pot);lnew("f_own",a.owner,"ownList","Nombre del dueño");parNew("f_mom",a.mom,0);parNew("f_dad",a.dad,1);
  const ag=()=>$("f_age").textContent=$("f_born").value?"Edad: "+edad($("f_born").value):"";$("f_born").oninput=ag;ag();
  let ph=a.photo||"";
  $("f_ph").onchange=e=>{const f=e.target.files[0];if(f)shrink(f,d=>{ph=d;$("pv").src=d;$("pv").style.display="block"})};
  $("ok").onclick=()=>{const tag=$("f_tag").value.trim();if(!tag)return alert("Falta la caravana");
    if(!isSN(tag)&&S.animals.some(x=>x.tag===tag&&x.id!==a.id&&x.status!=="baja"))return alert("Esa caravana ya existe");
    const o={id:a.id||uid(),tag,name:$("f_name").value.trim(),cat:$("f_cat").value,born:$("f_born").value,breed:$("f_breed").value.trim(),photo:ph,owner:$("f_own").value.trim(),note:$("f_note").value.trim(),pot:$("f_pot").value.trim(),mom:$("f_mom").value.trim(),dad:$("f_dad").value.trim(),status:a.status||"activo"};
    if(a.id)Object.assign(a,o);else S.animals.push(o);save();close();render()};
  $("cx").onclick=close}
const vacPlan=()=>{if(!S.meta.vacPlan)S.meta.vacPlan=[{id:"v1",name:"12 Vías",months:12},{id:"v2",name:"Ántrax",months:12},{id:"v3",name:"Pierna Negra",months:12}];return S.meta.vacPlan};
const lastApp=n=>S.events.filter(e=>(e.product||"").trim().toLowerCase()===n.trim().toLowerCase()).sort((a,b)=>b.date.localeCompare(a.date))[0];
function fSan(E){E=E||{};if(!act().length)return alert("Primero cargá al menos un animal");const ed=!!E.id,rep0=E.rep||"";
  sheet(`<h1>${ed?"Editar registro sanitario":"Registro sanitario"}</h1>
  <label>Animal</label><select id="f_a"><option value="ALL" ${E.aid==="ALL"?"selected":""}>Todo el rebaño</option>${act().map(a=>`<option value="${a.id}" ${a.id===E.aid?"selected":""}>#${esc(a.tag)} ${esc(a.name)}</option>`).join("")}</select>
  <label>Tipo</label><select id="f_t">${opts(SAN,E.type)}</select>
  <label>Fecha de aplicación</label><input type="date" id="f_d" value="${E.date||today()}">
  <label>Vacuna / medicamento</label>${lsel("f_p",E.product||"",vacPlan().map(p=>p.name),"prodList","— Sin producto —")}
  <label>¿Se repite?</label><select id="f_rep"><option value="">No se repite</option><option value="6" ${rep0==6?"selected":""}>Cada 6 meses</option><option value="12" ${rep0==12?"selected":""}>Anual (cada 12 meses)</option></select>
  <label>Próxima aplicación (genera alerta con anticipación)</label><input type="date" id="f_nx" value="${E.next||""}">
  <label>Días de retiro (leche/carne)</label><input type="number" inputmode="numeric" id="f_r" placeholder="0" value="${E.days||""}">
  <label>Notas</label><textarea id="f_n" rows="2">${esc(E.note)}</textarea>
  <button id="ok">Guardar</button><br><br>${ed?'<button class="d" id="del">Eliminar</button><br><br>':""}<button class="s" id="cx">Cancelar</button>`);
  lnew("f_p",E.product||"","prodList","Nombre de la vacuna o medicamento");
  const auto=()=>{const m=+$("f_rep").value;if(m&&$("f_d").value)$("f_nx").value=addM($("f_d").value,m)};
  $("f_rep").onchange=auto;$("f_d").onchange=auto;
  $("f_p").addEventListener("change",()=>{const p=vacPlan().find(x=>x.name===$("f_p").value);if(p){$("f_rep").value=p.months===6||p.months===12?String(p.months):"";auto();if(p.months===12||p.months===6){}else if(p.months&&$("f_d").value)$("f_nx").value=addM($("f_d").value,p.months)}});
  if(!ed&&rep0)auto();
  $("ok").onclick=()=>{const o={aid:$("f_a").value,type:$("f_t").value,date:$("f_d").value||today(),product:$("f_p").value.trim(),days:+$("f_r").value||0,next:$("f_nx").value,note:$("f_n").value.trim()};
    if(ed)Object.assign(E,o);else S.events.push({id:uid(),...o});save();close();render()};
  if(ed)$("del").onclick=()=>{if(confirm("¿Eliminar este registro sanitario?")){S.events=S.events.filter(x=>x!==E);save();close();render()}};
  $("cx").onclick=close}
function fPlan(){const P2=vacPlan(),t=today();
  sheet(`<h1>📋 Plan anual de vacunas</h1><p class="mu">Las vacunas de esta lista generan una alerta ${AD()} días antes de la próxima fecha, según la última aplicación que registres.</p>${P2.map(p=>{const l=lastApp(p.name),due=l?addM(l.date,p.months):null,r=due?dd(due,t):null;
    return `<div class="card ${r!==null&&r<=7?"warn":""}"><div class="row"><span class="b">💉 ${esc(p.name)}</span><span class="mu">cada ${p.months===12?"año":p.months+" meses"}</span></div><div class="mu">${l?"Última: "+fmt(l.date)+" · Próxima: "+fmt(due)+(r<0?" (vencida hace "+(-r)+" d)":r===0?" (¡hoy!)":" (en "+r+" d)"):"Sin aplicación registrada"}</div><div class="row" style="margin-top:8px;gap:8px"><button class="s pl1" data-i="${p.id}" style="padding:9px;font-size:14px">Registrar aplicación</button><button class="s pl2" data-i="${p.id}" style="padding:9px;font-size:14px">Editar</button></div></div>`}).join("")||'<p class="mu">Sin vacunas en el plan.</p>'}
  <button id="pa">+ Agregar vacuna al plan</button><br><br><button class="s" id="cx">Cerrar</button>`);
  document.querySelectorAll(".pl1").forEach(b=>b.onclick=()=>{const p=P2.find(x=>x.id===b.dataset.i);fSan({aid:"ALL",type:"Vacunación",product:p.name,rep:p.months})});
  document.querySelectorAll(".pl2").forEach(b=>b.onclick=()=>fPlanItem(P2.find(x=>x.id===b.dataset.i)));
  $("pa").onclick=()=>fPlanItem();$("cx").onclick=close}
function fPlanItem(p){p=p||{};sheet(`<h1>${p.id?"Editar":"Nueva"} vacuna del plan</h1><label>Nombre de la vacuna *</label><input id="pv_n" value="${esc(p.name)}"><label>Frecuencia</label><select id="pv_m">${[3,4,6,12,24].map(n=>`<option value="${n}" ${n===(p.months||12)?"selected":""}>${n===12?"Anual (cada 12 meses)":n===24?"Cada 2 años":"Cada "+n+" meses"}</option>`).join("")}</select><button id="ok">Guardar</button><br><br>${p.id?'<button class="d" id="del">Quitar del plan</button><br><br>':""}<button class="s" id="cx">Cancelar</button>`);
  $("ok").onclick=()=>{const n=$("pv_n").value.trim();if(!n)return alert("Falta el nombre");const o={name:n,months:+$("pv_m").value};if(p.id)Object.assign(p,o);else vacPlan().push({id:uid(),...o});save();fPlan()};
  if(p.id)$("del").onclick=()=>{S.meta.vacPlan=vacPlan().filter(x=>x!==p);save();fPlan()};$("cx").onclick=fPlan}
function fMov(){
  sheet(`<h1>Movimiento de rebaño</h1>
  <label>Tipo</label><select id="f_t">${opts(MOV)}</select>
  <div id="gn"><label>N.º de arete / caravana *</label><input id="f_g" list="tags"></div><div id="gs"><label>Animal que sale del inventario *</label><select id="f_s">${[...act()].sort((a,b)=>a.tag.localeCompare(b.tag,"es",{numeric:true})).map(a=>`<option value="${a.id}">#${esc(a.tag)} ${esc(a.name)} · ${a.cat}</option>`).join("")}</select></div>
  <div id="nw"><label>Categoría</label>${catSel("f_c","Ternera")}</div>
  <label>Fecha</label><input type="date" id="f_d" value="${today()}">
  <div id="nw2"><label>Nombre del animal (opcional)</label><input id="f_nm"><label>Raza</label><input id="f_br"><label>Dueño</label>${lsel("f_ow","",[...OWN,...owners()],"ownList","— Sin dueño —")}<div id="bdw"><label>Fecha de nacimiento (si la conocés)</label><input type="date" id="f_bd"></div><label>Madre (arete)</label>${parSel("f_mo","",0)}<label>Padre (arete o toro)</label>${parSel("f_pa","",1)}
  <label>Potrero / ubicación</label>${potSel("f_po","")}
  <label>Foto del animal</label><div class="row" style="justify-content:flex-start;gap:12px;margin-bottom:10px"><img id="mv_pv" class="ph" style="width:64px;height:64px;display:none"><input type="file" id="mv_f" accept="image/*" style="margin:0"></div></div>
  <label>Monto (solo compra o venta; se registra en Caja)</label><input id="f_m" inputmode="decimal">
  <label>Nota (comprador, causa…)</label><input id="f_n">
  <button id="ok">Guardar</button><br><br><button class="s" id="cx">Cancelar</button>`);
  const tg=()=>{const n=["Nacimiento","Compra"].includes($("f_t").value);$("nw").style.display=n?"block":"none";$("nw2").style.display=n?"block":"none";$("gn").style.display=n?"block":"none";$("gs").style.display=n?"none":"block";$("bdw").style.display=$("f_t").value==="Compra"?"block":"none"};let mph="";$("mv_f").onchange=e=>{const f=e.target.files[0];if(f)shrink(f,d=>{mph=d;$("mv_pv").src=d;$("mv_pv").style.display="block"})};potNew("f_po","");lnew("f_ow","","ownList","Nombre del dueño");catNew("f_c","Ternera");parNew("f_mo","",0);parNew("f_pa","",1);
  $("f_t").onchange=tg;tg();
  $("ok").onclick=()=>{const type=$("f_t").value,bj=type==="Venta"||type==="Muerte",sel=bj?byId($("f_s").value):null,tag=bj?(sel?sel.tag:""):$("f_g").value.trim();if(!tag)return alert(bj?"Elegí el animal de la lista":"Falta el arete");
    const ex=bj?sel:act().find(a=>a.tag===tag),d=$("f_d").value||today();
    if(type==="Nacimiento"||type==="Compra"){if(ex&&!isSN(tag))return alert("Esa caravana ya existe");
      S.animals.push({id:uid(),tag,name:$("f_nm").value.trim(),photo:mph,cat:$("f_c").value,born:type==="Nacimiento"?d:($("f_bd").value||""),breed:$("f_br").value.trim(),owner:$("f_ow").value,mom:$("f_mo").value.trim(),dad:$("f_pa").value.trim(),pot:$("f_po").value.trim(),status:"activo"})}
    else{if(!ex)return alert("No encontré un animal activo con esa caravana");ex.status="baja";ex.baja={type,date:d}}
    S.moves.push({id:uid(),type,tag,date:d,note:$("f_n").value.trim()});const mt=parseFloat($("f_m").value.replace(",","."));if(mt>0&&(type==="Venta"||type==="Compra"))S.fin.push({id:uid(),kind:type==="Venta"?"ingreso":"gasto",cat:type==="Venta"?"Venta de animales":"Compra de animales",amount:mt,date:d,note:"Arete "+tag});save();close();render()};
  $("cx").onclick=close}
function detail(a){
  const ev=S.events.filter(e=>e.aid===a.id||e.aid==="ALL").sort((x,y)=>y.date.localeCompare(x.date)),rp=S.repro.filter(e=>e.aid===a.id).sort((x,y)=>y.date.localeCompare(x.date)),st=rs(a.id);
  sheet(`${a.photo?`<img src="${a.photo}" style="width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-bottom:10px">`:""}<h1>${nm(a)}</h1><p class="mu">${a.cat}${a.born?" · Nació "+fmt(a.born):""}${a.breed?" · "+esc(a.breed):""}${a.owner?" · Dueño: "+esc(a.owner):""}</p>
  ${hv(a)}${isM(a.cat)?"":`<h2>Reproducción · ${st.st}${st.due?" · parto "+fmt(st.due):""}</h2>${rp.map(e=>`<div class="card"><div class="row"><span class="b">${e.type}${e.result?" · "+e.result:""}</span><span class="mu">${fmt(e.date)}</span></div><div class="mu">${esc(e.detail)}${e.note?" · "+esc(e.note):""}</div></div>`).join("")||'<p class="mu">Sin eventos.</p>'}`}<h2>Historial sanitario</h2>${ev.map(e=>`<div class="card"><div class="row"><span class="b">${e.type}</span><span class="mu">${fmt(e.date)}</span></div><div class="mu">${esc(e.product)}${e.note?" · "+esc(e.note):""}</div></div>`).join("")||'<p class="mu">Sin registros.</p>'}
  ${st.st==="preñada"?'<button class="s" id="pg">📅 Fecha de preñez / parto probable</button><br><br>':""}${st.st==="servida"?'<button class="s" id="cfm">✅ Confirmar preñez</button><br><br>':""}<button id="pdfv">📄 Hoja de vida (PDF)</button><br><br><button id="ed">Editar</button><br><br><button class="d" id="del">Eliminar animal</button><br><br><button class="s" id="cx">Cerrar</button>`);
  $("ed").onclick=()=>fAnimal(a);$("pdfv").onclick=()=>pdfCV(a);if(st.st==="preñada")$("pg").onclick=()=>fPren(a.id);if(st.st==="servida")$("cfm").onclick=()=>fConf(a.id);
  $("del").onclick=()=>{if(confirm("¿Eliminar este animal y su historial?")){S.animals=S.animals.filter(x=>x!==a);S.events=S.events.filter(e=>e.aid!==a.id);S.repro=S.repro.filter(e=>e.aid!==a.id);save();close();render()}};
  $("cx").onclick=close}
document.addEventListener("click",e=>{
  {const L=e.target.closest("a");if(L&&!L.dataset.t)return}
  const t=e.target.closest("[data-t]");if(t){e.preventDefault();tab=t.dataset.t;render();return}
  const a=e.target.closest("[data-a]");if(a){detail(byId(a.dataset.a));return}
  if(e.target.closest("[data-milk]")){fLeche(today());return}
  if(e.target.closest("[data-more]")){aLim+=50;render();return}
  if(e.target.closest("[data-al]")){fAlertas();return}
  if(e.target.closest("[data-po]")){pdfOwner();return}
  if(e.target.closest("[data-pd]")){pdfDescarte();return}
  if(e.target.closest("[data-ps]")){pdfSinArete();return}
  if(e.target.closest("[data-pl]")){pdfList();return}
  if(e.target.closest("[data-er]")){fER("mes");return}
  {const cp=e.target.closest("[data-cp]");if(cp){pdfCaja(cp.dataset.cp);return}}
  if(e.target.closest("[data-prof2]")){fProf();return}
  const pe=e.target.closest("[data-pe]");if(pe){const p=S.meta.people.find(x=>x.id===pe.dataset.pe);fPerson(p.kind,p);return}
  const sc=e.target.closest("[data-sec]");if(sc){PZ[sc.dataset.sec]=!PZ[sc.dataset.sec];render();return}
  const cfb=e.target.closest("[data-cf]");if(cfb){fConf(cfb.dataset.cf);return}
  const tl=e.target.closest("[data-tl]");if(tl){fTool(S.tools.find(x=>x.id===tl.dataset.tl));return}
  const tls=e.target.closest("[data-tools]");if(tls){fTools();return}
  const pf=e.target.closest("[data-prof]");if(pf){fProf();return}
  const rb=e.target.closest("[data-rep]");if(rb){fRep();return}
  const mm=e.target.closest("[data-m]");if(mm){fm=shiftM(fm,+mm.dataset.m);render();return}
  const ff=e.target.closest("[data-f]");if(ff){fFin(S.fin.find(x=>x.id===ff.dataset.f));return}
  const rr=e.target.closest("[data-r]");if(rr){const ev=S.repro.find(x=>x.id===rr.dataset.r);ev.svc&&S.repro.some(z=>z.id===ev.svc)?fPrenC(ev):fRepro(ev);return}
  const v=e.target.closest("[data-e]");if(v){fSan(S.events.find(x=>x.id===v.dataset.e));return}
  if(e.target.closest("[data-plan]")){fPlan();return}
  if(e.target.id==="sh")close()});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;aLim=50;const p=e.target.selectionStart;render();const i=$("q");i.focus();i.setSelectionRange(p,p)}});
$("gear").onclick=fSet;$("fab").onclick=()=>tab==="rebano"?fMov():tab==="animales"?fAnimal():tab==="sanidad"?fSan():tab==="repro"?fRepro():fFin();
(async()=>{try{const v=await idbGet();if(v)S=JSON.parse(v);else{const r=localStorage.getItem("tambo");if(r){S=JSON.parse(r);save()}}}catch(e){}
  norm();render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{})})();
</script>
